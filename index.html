<!DOCTYPE html>
<html>
  <head>
    <title>Random Name Generator</title>
    <link rel="stylesheet" href="style.css">
    <style>
      .logo {
        display: block;
        margin: 20px auto;
      }
    </style>
  </head>
  <body>
    <h1>MIT Press Random Name Generator</h1>
    <h2>Can't decide who to meet for 5/15/45? Click the button below and receive the name of a random colleague who works at the Press.</h2>
    <p id="name"></p>
    <button onclick="generateName()">Generate</button>
    <img src="Colophon.png" alt="MIT Press logo" width="300" class="logo">
    <script src="script.js"></script>
  </body>
</html>
